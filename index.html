<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Signage</title>
<style>
@font-face {
    font-family: 'GenEiNuGothic';
    src: url('./GenEiNuGothic-EB.ttf') format('truetype');
}
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
#videoScreen, #clockScreen, #imageScreen { width: 100%; height: 100%; }
video { width: 100%; height: 100%; object-fit: contain; background: #000; }
#clockScreen { display: none; position: relative; overflow: hidden; background: #0057d8; color: #fff; justify-content: center; align-items: center; }
#clockVideo { position: absolute; inset: 0; }
#clock { position: relative; z-index: 1; width: 100%; height: 100%; color: #fff; font-family: 'GenEiNuGothic', sans-serif; text-shadow: 0 0 10px rgba(0,0,0,.2), 0 0 30px rgba(0,0,0,.2), 0 0 60px rgba(0,0,0,.2); }
#date { position: absolute; left: 50%; top: calc(50% - 40vh); transform: translateX(-50%); font-size: 10vh; white-space: nowrap; }
#time { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); display: flex; white-space: nowrap; font-size: 50vh; font-variant-numeric: tabular-nums; }
#imageScreen { display: none; justify-content: center; align-items: center; background: #000; }
#image { width: 100%; height: 100%; object-fit: contain; }
#loadError { display: none; position: fixed; inset: auto 16px 16px; z-index: 10; padding: 12px 16px; background: rgba(0,0,0,.8); color: white; font: 16px sans-serif; }
</style>
</head>
<body>
<div id="videoScreen"><video id="video" autoplay muted playsinline></video></div>
<div id="imageScreen"><img id="image" alt=""></div>
<div id="clockScreen">
    <video id="clockVideo" muted autoplay preload="auto" playsinline></video>
    <div id="clock"><div id="date"></div><div id="time"><span id="hours">00</span><span id="colon">:</span><span id="minutes">00</span></div></div>
</div>
<div id="loadError" role="status"></div>
<script>
const video = document.getElementById('video');
const videoScreen = document.getElementById('videoScreen');
const imageScreen = document.getElementById('imageScreen');
const image = document.getElementById('image');
const clockScreen = document.getElementById('clockScreen');
const clockVideo = document.getElementById('clockVideo');
const loadError = document.getElementById('loadError');
const hours = document.getElementById('hours');
const minutes = document.getElementById('minutes');
const colon = document.getElementById('colon');

const fallbackPlaylist = [
    { type: 'video', src: 'movie.mp4', duration: null },
    { type: 'clock', src: '260929あき.mp4', duration: null },
    { type: 'image', src: 'image_ecc1.png', duration: 15 },
    { type: 'clock', src: '260929あき.mp4', duration: null },
    { type: 'video', src: 'movie_min1.mp4', duration: null },
    { type: 'clock', src: '260929あき.mp4', duration: null },
    { type: 'image', src: 'image_ecc2.png', duration: 15 },
    { type: 'clock', src: '260929あき.mp4', duration: null },
    { type: 'image', src: 'image_min.png', duration: 15 },
    { type: 'clock', src: '260929あき.mp4', duration: null },
    { type: 'image', src: 'image_ecc3.png', duration: 15 },
    { type: 'clock', src: '260929あき.mp4', duration: null }
];

let playlist = [];
let sequenceIndex = 0;
let advanceTimer = null;
let advancing = false;

function ordinal(day) {
    if (day % 10 === 1 && day % 100 !== 11) return 'st';
    if (day % 10 === 2 && day % 100 !== 12) return 'nd';
    if (day % 10 === 3 && day % 100 !== 13) return 'rd';
    return 'th';
}

function updateClock() {
    const now = new Date();
    hours.textContent = String(now.getHours()).padStart(2, '0');
    minutes.textContent = String(now.getMinutes()).padStart(2, '0');
    colon.style.opacity = now.getSeconds() % 2 === 0 ? '1' : '0';
    const weekday = now.toLocaleString('en-US', { weekday: 'long' });
    const month = now.toLocaleString('en-US', { month: 'long' });
    const day = now.getDate();
    document.getElementById('date').textContent = `${weekday}, ${month} ${day}${ordinal(day)}`;
}

function isClock(item) {
    return ['clock', 'clock1', 'clock2'].includes(item.type);
}

function mediaUrl(filename) {
    return `./${encodeURIComponent(filename)}`;
}

function scheduleAdvance(seconds) {
    clearTimeout(advanceTimer);
    advanceTimer = setTimeout(advance, Math.max(1, seconds) * 1000);
}

function advance() {
    if (advancing || !playlist.length) return;
    advancing = true;
    sequenceIndex = (sequenceIndex + 1) % playlist.length;
    showCurrent();
    advancing = false;
}

function showCurrent() {
    if (!playlist.length) return;
    clearTimeout(advanceTimer);
    video.pause();
    clockVideo.pause();
    videoScreen.style.display = 'none';
    imageScreen.style.display = 'none';
    clockScreen.style.display = 'none';
    const item = playlist[sequenceIndex];

    if (isClock(item)) {
        clockScreen.style.display = 'flex';
        updateClock();
        clockVideo.src = mediaUrl(item.src);
        clockVideo.load();
        clockVideo.onloadedmetadata = () => {
            if (playlist[sequenceIndex] !== item) return;
            scheduleAdvance(Number(item.duration) > 0 ? Number(item.duration) : clockVideo.duration);
        };
        clockVideo.play().catch(() => {});
        return;
    }

    if (item.type === 'image') {
        imageScreen.style.display = 'flex';
        image.src = mediaUrl(item.src);
        scheduleAdvance(Number(item.duration) > 0 ? Number(item.duration) : 15);
        return;
    }

    videoScreen.style.display = 'block';
    video.src = mediaUrl(item.src);
    video.load();
    if (Number(item.duration) > 0) scheduleAdvance(Number(item.duration));
    video.play().catch(() => {});
}

video.addEventListener('ended', () => {
    if (playlist[sequenceIndex]?.type === 'video' && !Number(playlist[sequenceIndex].duration)) advance();
});

document.addEventListener('click', event => {
    if (event.target.closest('#videoScreen, #imageScreen, #clockScreen')) advance();
});

document.addEventListener('keydown', event => {
    if (event.code === 'Space') {
        event.preventDefault();
        advance();
    }
});

async function start() {
    updateClock();
    setInterval(updateClock, 1000);
    if (new URLSearchParams(location.search).get('preview') === '1') {
        window.addEventListener('message', event => {
            if (event.origin !== location.origin || event.source !== parent) return;
            if (event.data?.type !== 'signage-preview-playlist' || !Array.isArray(event.data.playlist) || !event.data.playlist.length) return;
            playlist = event.data.playlist;
            sequenceIndex = 0;
            loadError.style.display = 'none';
            showCurrent();
        });
        parent.postMessage({ type: 'signage-preview-ready' }, location.origin);
        return;
    }
    try {
        const response = await fetch('./signage-playlist.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`設定JSONの読み込みに失敗しました (${response.status})`);
        const data = await response.json();
        if (!Array.isArray(data.playlist) || !data.playlist.length) throw new Error('設定JSONにプレイリストがありません');
        playlist = data.playlist;
    } catch (error) {
        console.error(error);
        playlist = fallbackPlaylist;
        loadError.textContent = 'signage-playlist.json を読み込めません。GitHub Pages またはローカルWebサーバーから開いてください。既定の再生順で開始します。';
        loadError.style.display = 'block';
        setTimeout(() => { loadError.style.display = 'none'; }, 8000);
    }
    showCurrent();
}

start();
</script>
</body>
</html>
